<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <!-- Bierzelt-Inneres, Hochformat. Dient als Bühne für den Marketender. -->
  <defs>
    <linearGradient id="luft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e3b8"/>
      <stop offset="1" stop-color="#e8c98f"/>
    </linearGradient>
    <linearGradient id="boden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2c"/>
      <stop offset="1" stop-color="#6b4420"/>
    </linearGradient>
    <radialGradient id="lampe" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- warme Zeltluft -->
  <rect x="0" y="0" width="720" height="1280" fill="url(#luft)"/>

  <!-- Zeltdach: blau-weiße Bahnen, leicht durchhängend -->
  <g>
    <path d="M0 0 H720 V70 Q540 110 360 70 Q180 110 0 70 Z" fill="#f3f1ea"/>
    <g fill="#5a78b4">
      <path d="M0 0 H90 V72 Q45 80 0 70 Z"/>
      <path d="M180 0 H270 V70 Q225 88 180 78 Z"/>
      <path d="M360 0 H450 V70 Q405 80 360 70 Z"/>
      <path d="M540 0 H630 V78 Q585 88 540 70 Z"/>
    </g>
    <!-- Wimpelkette -->
    <path d="M0 96 Q360 150 720 96" fill="none" stroke="#7a5a2a" stroke-width="3"/>
    <g>
      <path d="M40 104 l18 0 l-9 22 Z" fill="#d23b3b"/>
      <path d="M150 120 l18 0 l-9 22 Z" fill="#e8c33a"/>
      <path d="M270 130 l18 0 l-9 22 Z" fill="#3a8f4a"/>
      <path d="M380 132 l18 0 l-9 22 Z" fill="#d23b3b"/>
      <path d="M500 126 l18 0 l-9 22 Z" fill="#e8c33a"/>
      <path d="M610 114 l18 0 l-9 22 Z" fill="#3a8f4a"/>
    </g>
  </g>

  <!-- Stützmast links/rechts -->
  <rect x="40" y="70" width="34" height="880" rx="6" fill="#9c6a36"/>
  <rect x="40" y="70" width="12" height="880" fill="#b07e44" opacity="0.6"/>
  <rect x="646" y="70" width="34" height="880" rx="6" fill="#9c6a36"/>
  <rect x="646" y="70" width="12" height="880" fill="#b07e44" opacity="0.6"/>

  <!-- Hängelampe mit Lichtschein -->
  <line x1="360" y1="100" x2="360" y2="150" stroke="#5a4424" stroke-width="3"/>
  <ellipse cx="360" cy="240" rx="150" ry="150" fill="url(#lampe)"/>
  <path d="M335 150 H385 L398 186 H322 Z" fill="#3a2c18"/>
  <circle cx="360" cy="196" r="10" fill="#fff3c4"/>

  <!-- Banner (Schriftzug kommt als Godot-Label, thorvg rendert kein Text-Tag) -->
  <g>
    <rect x="190" y="170" width="340" height="74" rx="10" fill="#7a2f33" stroke="#e6d18a" stroke-width="4"/>
    <rect x="206" y="186" width="308" height="42" rx="6" fill="none" stroke="#e6d18a" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Holzdielen-Boden -->
  <rect x="0" y="950" width="720" height="330" fill="url(#boden)"/>
  <g stroke="#5a3a1c" stroke-width="2" opacity="0.6">
    <line x1="0" y1="1010" x2="720" y2="1010"/>
    <line x1="0" y1="1080" x2="720" y2="1080"/>
    <line x1="0" y1="1160" x2="720" y2="1160"/>
    <line x1="0" y1="1240" x2="720" y2="1240"/>
    <line x1="180" y1="950" x2="180" y2="1280"/>
    <line x1="420" y1="950" x2="420" y2="1280"/>
    <line x1="600" y1="950" x2="600" y2="1280"/>
  </g>

  <!-- Bierbank-Garnitur hinten -->
  <g>
    <rect x="120" y="858" width="480" height="26" rx="4" fill="#caa15e" stroke="#8a6534" stroke-width="2"/>
    <rect x="140" y="884" width="14" height="60" fill="#8a6534"/>
    <rect x="566" y="884" width="14" height="60" fill="#8a6534"/>
    <rect x="150" y="930" width="420" height="16" rx="3" fill="#b88f4e" stroke="#8a6534" stroke-width="2"/>
  </g>
</svg>
