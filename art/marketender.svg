<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 380" width="220" height="380">
  <!-- Marketender: Mannsbild im Dirndl (Schürze, Schnapsfassl, Dreitagebart) -->
  <defs>
    <linearGradient id="dirndl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c33a41"/>
      <stop offset="1" stop-color="#9c2027"/>
    </linearGradient>
    <linearGradient id="schuerze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fbf6a"/>
      <stop offset="1" stop-color="#5d9e4d"/>
    </linearGradient>
    <linearGradient id="fassl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06a30"/>
      <stop offset="1" stop-color="#7a4d22"/>
    </linearGradient>
  </defs>

  <!-- Schatten -->
  <ellipse cx="110" cy="368" rx="74" ry="12" fill="#000" opacity="0.18"/>

  <!-- Dirndl-Rock (zu eng, beult etwas) -->
  <path d="M62 222 Q110 214 158 222 L188 360 L32 360 Z" fill="url(#dirndl)" stroke="#7e191f" stroke-width="3"/>
  <!-- Beine in Wadlstrümpfen -->
  <rect x="80" y="350" width="22" height="24" rx="4" fill="#e9e2d2"/>
  <rect x="118" y="350" width="22" height="24" rx="4" fill="#e9e2d2"/>
  <rect x="78" y="368" width="26" height="10" rx="3" fill="#2a1d12"/>
  <rect x="116" y="368" width="26" height="10" rx="3" fill="#2a1d12"/>

  <!-- Schürze -->
  <path d="M80 226 L140 226 L160 348 L60 348 Z" fill="url(#schuerze)" stroke="#4d8540" stroke-width="2"/>
  <path d="M80 226 Q110 236 140 226" fill="none" stroke="#cfe8c4" stroke-width="3"/>
  <!-- Schürzenmasche -->
  <path d="M96 226 Q110 214 124 226 Q110 222 96 226 Z" fill="#cfe8c4"/>

  <!-- Dirndl-Mieder -->
  <path d="M70 150 Q110 140 150 150 L156 226 L64 226 Z" fill="url(#dirndl)" stroke="#7e191f" stroke-width="3"/>
  <!-- weiße Bluse Ausschnitt + Brusthaar-Gag -->
  <path d="M92 150 Q110 168 128 150 L128 162 Q110 176 92 162 Z" fill="#f5f0e6"/>
  <path d="M104 158 q3 4 0 8 M110 156 v10 M116 158 q-3 4 0 8" stroke="#3a2a1a" stroke-width="1.5" fill="none"/>
  <!-- Miederschnürung -->
  <path d="M100 168 L120 178 M120 168 L100 178 M100 184 L120 194 M120 184 L100 194" stroke="#f0e3b0" stroke-width="2"/>

  <!-- breite Mannsbild-Schultern / Puffärmel -->
  <ellipse cx="64" cy="158" rx="20" ry="24" fill="#f5f0e6" stroke="#d9d2c0" stroke-width="2"/>
  <ellipse cx="156" cy="158" rx="20" ry="24" fill="#f5f0e6" stroke="#d9d2c0" stroke-width="2"/>
  <!-- Unterarme -->
  <path d="M58 178 Q44 206 56 232" fill="none" stroke="#f3c9a0" stroke-width="18" stroke-linecap="round"/>
  <path d="M162 178 Q176 206 164 232" fill="none" stroke="#f3c9a0" stroke-width="18" stroke-linecap="round"/>
  <circle cx="56" cy="234" r="10" fill="#f3c9a0"/>
  <circle cx="164" cy="234" r="10" fill="#f3c9a0"/>

  <!-- Schnapsfassl umgehängt -->
  <path d="M150 150 L96 198" stroke="#5a3d1c" stroke-width="6" stroke-linecap="round"/>
  <rect x="80" y="190" width="40" height="30" rx="8" fill="url(#fassl)" stroke="#5a3d1c" stroke-width="2"/>
  <rect x="80" y="196" width="40" height="4" fill="#555"/>
  <rect x="80" y="210" width="40" height="4" fill="#555"/>
  <ellipse cx="100" cy="205" rx="6" ry="8" fill="#5a3d1c"/>

  <!-- Hals (kräftig) -->
  <rect x="98" y="118" width="24" height="24" fill="#e9bd92"/>

  <!-- Kopf -->
  <circle cx="110" cy="96" r="35" fill="#f3c9a0"/>
  <!-- Wangen -->
  <circle cx="88" cy="104" r="7" fill="#e89a7a" opacity="0.55"/>
  <circle cx="132" cy="104" r="7" fill="#e89a7a" opacity="0.55"/>
  <!-- buschige Augenbrauen -->
  <path d="M92 84 q8 -5 16 -1" stroke="#3a2a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M128 83 q-8 -5 -16 -1" stroke="#3a2a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Augen -->
  <circle cx="100" cy="92" r="4.5" fill="#2b2b2b"/>
  <circle cx="120" cy="92" r="4.5" fill="#2b2b2b"/>
  <circle cx="101.5" cy="90.5" r="1.5" fill="#fff"/>
  <circle cx="121.5" cy="90.5" r="1.5" fill="#fff"/>
  <!-- Knollnase -->
  <ellipse cx="110" cy="104" rx="7" ry="5" fill="#eab48c"/>
  <!-- breites Grinsen -->
  <path d="M94 114 Q110 128 126 114" fill="none" stroke="#7a3b2b" stroke-width="3" stroke-linecap="round"/>
  <!-- Dreitagebart (er bleibt a Mannsbild) -->
  <g fill="#4a3a2a">
    <circle cx="92" cy="118" r="1.3"/><circle cx="100" cy="124" r="1.3"/>
    <circle cx="110" cy="127" r="1.3"/><circle cx="120" cy="124" r="1.3"/>
    <circle cx="128" cy="118" r="1.3"/><circle cx="96" cy="122" r="1.3"/>
    <circle cx="114" cy="126" r="1.3"/><circle cx="124" cy="122" r="1.3"/>
    <circle cx="104" cy="126" r="1.3"/><circle cx="88" cy="112" r="1.3"/>
    <circle cx="132" cy="112" r="1.3"/>
  </g>

  <!-- Haare + alberne Maschen -->
  <path d="M78 78 Q88 56 110 58 Q132 56 142 78 Q132 70 110 70 Q88 70 78 78 Z" fill="#3a2a1a"/>
  <circle cx="80" cy="66" r="8" fill="#e89ab0"/>
  <circle cx="92" cy="62" r="8" fill="#e89ab0"/>
  <circle cx="86" cy="66" r="4" fill="#c9728c"/>
</svg>
